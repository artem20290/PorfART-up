<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Allow embedding in portfolio iframe; keep scripts/styles same-origin -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   script-src 'self';
                   style-src 'self';
                   img-src 'self' data:;
                   font-src 'self';
                   connect-src 'self' https://www.google.com https://speech.googleapis.com;
                   frame-src 'none';
                   object-src 'none';
                   base-uri 'none';
                   form-action 'none';
                   frame-ancestors 'self';">

    <meta name="referrer" content="no-referrer">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">

    <title>Корпоративный календарь</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-scale-wrapper">
    <div class="calendar">
        <div class="logo-row">
            <img id="blueSquareImage" class="left-logo" src="assets/blue-square.png" alt="Синий квадрат" />
            <div class="right-logo brand">
                <img class="brand-mark" src="assets/logo-mark.png" alt="SB" width="30" height="30" />
                <span class="brand-title">Корпоративный календарь</span>
            </div>
        </div>

        <!-- Быстрые действия -->
        <div class="quick-actions" id="quickActions">
            <div class="quick-action-slot" id="vkusSlot">
                <button type="button" class="quick-action-btn" id="vkusBtn">
                    <img class="quick-action-btn-icon" id="vkusBtnIcon" src="assets/vkus.png" alt="" aria-hidden="true">
                    <span class="quick-action-btn-label">Запрос</span>
                </button>
                <div class="quick-action-expanded" id="vkusExpanded" hidden>
                    <div class="quick-action-input-wrap" id="vkusInputWrap">
                        <input type="text" class="quick-action-input" id="vkusInput" placeholder="Голосовой текст..." autocomplete="off" spellcheck="false">
                        <button type="button" class="quick-action-close-btn" id="vkusCloseBtn" aria-label="Отменить ввод">
                            <svg class="quick-action-close-icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M6.3 6.3a1 1 0 0 1 1.4 0L12 10.6l4.3-4.3a1 1 0 1 1 1.4 1.4L13.4 12l4.3 4.3a1 1 0 0 1-1.4 1.4L12 13.4l-4.3 4.3a1 1 0 0 1-1.4-1.4L10.6 12 6.3 7.7a1 1 0 0 1 0-1.4Z" fill="currentColor"/>
                            </svg>
                        </button>
                        <button type="button" class="quick-action-mic-btn" id="vkusMicBtn" aria-label="Микрофон">
                            <svg class="quick-action-mic-icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3Z" fill="currentColor"/>
                                <path d="M19 11a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.92V21H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-3.08A7 7 0 0 0 19 11Z" fill="currentColor"/>
                            </svg>
                        </button>
                    </div>
                    <div class="quick-action-suggestions" id="vkusSuggestions" hidden role="listbox" aria-label="Варианты справки"></div>
                </div>
            </div>
            <div class="quick-action-slot" id="plannerSlot">
                <button type="button" class="quick-action-btn" id="plannerBtn">
                    <img class="quick-action-btn-icon" id="plannerBtnIcon" src="assets/planner.png" alt="" aria-hidden="true">
                    <span class="quick-action-btn-label">Планировщик</span>
                </button>
                <div class="quick-action-expanded" id="plannerExpanded" hidden>
                    <div class="quick-action-input-wrap" id="plannerInputWrap">
                        <input type="text" class="quick-action-input" id="plannerInput" placeholder="Голосовой запрос..." autocomplete="off" spellcheck="false">
                        <button type="button" class="quick-action-close-btn" id="plannerCloseBtn" aria-label="Отменить ввод">
                            <svg class="quick-action-close-icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M6.3 6.3a1 1 0 0 1 1.4 0L12 10.6l4.3-4.3a1 1 0 1 1 1.4 1.4L13.4 12l4.3 4.3a1 1 0 0 1-1.4 1.4L12 13.4l-4.3 4.3a1 1 0 0 1-1.4-1.4L10.6 12 6.3 7.7a1 1 0 0 1 0-1.4Z" fill="currentColor"/>
                            </svg>
                        </button>
                        <button type="button" class="quick-action-mic-btn" id="plannerMicBtn" aria-label="Микрофон">
                            <svg class="quick-action-mic-icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3Z" fill="currentColor"/>
                                <path d="M19 11a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.92V21H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-3.08A7 7 0 0 0 19 11Z" fill="currentColor"/>
                            </svg>
                        </button>
                    </div>
                    <div class="quick-action-suggestions" id="plannerSuggestions" hidden role="listbox" aria-label="Варианты справки"></div>
                </div>
            </div>
        </div>

        <!-- Блок реальной даты -->
        <div class="real-date">
            <div id="currentDate"></div>
        </div>

        <!-- Блок выбора года -->
        <div class="year-selector">
            <button id="prevYearBtn">&lt;&lt;</button>
            <div class="year-buttons">
                <!-- Кнопки будут добавляться динамически -->
            </div>
            <button id="nextYearBtn">&gt;&gt;</button>
        </div>

        <!-- Блок выбора месяца -->
        <div class="header">
            <button id="prevBtn">&lt;</button>
            <h1 id="monthYear"></h1>
            <button id="nextBtn">&gt;</button>
        </div>

        <!-- Сетка календаря -->
        <div class="calendar-grid">
            <!-- Дни недели -->
            <div class="weekdays">
                <div class="week-label">Неделя</div>
                <div>Пн</div>
                <div>Вт</div>
                <div>Ср</div>
                <div>Чт</div>
                <div>Пт</div>
                <div>Сб</div>
                <div>Вс</div>
            </div>

            <!-- Ячейки дней -->
            <div class="days" id="daysContainer"></div>
        </div>
    </div>
    </div>

    <!-- No inline JS (CSP-safe) -->
    <script src="script.js"></script>
</body>
</html>
